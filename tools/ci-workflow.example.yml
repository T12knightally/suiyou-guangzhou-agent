name: Verify and capture browser evidence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and historical replay
        run: |
          python -m unittest discover -s tests -v
          python tools/replay_evidence.py
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start service and verify real browser
        run: |
          python app.py > server.log 2>&1 &
          python tools/wait_server.py
          python verify_http.py
          node tools/verify_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            evidence/browser/
            server.log
          retention-days: 30
